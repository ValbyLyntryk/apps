name: Email archive exe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "email_archive.py"
      - "eml_archive/**"
      - "build_exe.py"
      - "build_exe.bat"
      - "requirements-build.txt"
      - ".github/workflows/email-archive-exe.yml"
  push:
    paths:
      - "email_archive.py"
      - "eml_archive/**"
      - "build_exe.py"
      - "build_exe.bat"
      - "requirements-build.txt"
      - ".github/workflows/email-archive-exe.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build portable exe
        run: python build_exe.py --use-current-python

      - name: Smoke-test start
        shell: pwsh
        run: |
          $exe = Resolve-Path .\dist\EmailArchive.exe
          $proc = Start-Process -FilePath $exe -ArgumentList '--demo','--no-browser','--port','8775' -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            foreach ($i in 1..40) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8775/api/health' -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw 'EmailArchive.exe did not respond on http://127.0.0.1:8775/api/health' }
            Invoke-WebRequest -Uri 'http://127.0.0.1:8775/' -UseBasicParsing -TimeoutSec 5 | Out-Null
            Invoke-WebRequest -Uri 'http://127.0.0.1:8775/api/emails' -UseBasicParsing -TimeoutSec 5 | Out-Null
          } finally {
            if ($proc -and !$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload EmailArchive.exe
        uses: actions/upload-artifact@v4
        with:
          name: EmailArchive-windows
          path: dist/EmailArchive.exe
